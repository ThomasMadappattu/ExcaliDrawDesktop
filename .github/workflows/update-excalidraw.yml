name: Update Excalidraw

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull latest @excalidraw/excalidraw
        run: npm install @excalidraw/excalidraw@latest
      - name: Verify build
        run: npm install && npm run build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-excalidraw
          commit-message: "chore: update @excalidraw/excalidraw"
          title: "chore: update @excalidraw/excalidraw"
          body: Automated update of the upstream Excalidraw package. The build passed.
